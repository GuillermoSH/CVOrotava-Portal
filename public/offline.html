<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Sin conexión — C.V. Orotava</title>
  <style>
    :root { --bg: #f0f0f4; --fg: #12121a; --muted: #3f3f50; --brand: #d01e1e; --brand-strong: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0d0f; --fg: #ececf1; --muted: #a1a1b3; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 360px; text-align: center; }
    img { width: 96px; height: 96px; margin: 0 auto 24px; display: block; }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: var(--muted); }
    button {
      min-height: 48px; padding: 0 28px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--brand); color: #fff; font: inherit; font-weight: 600;
    }
    button:hover { background: var(--brand-strong); }
    button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="96" height="96" />
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. Los datos del club solo se muestran con conexión, para que siempre sean los de hoy. Cuando vuelva la red, reintenta.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
